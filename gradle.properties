# Important Notes:
# A field used as ${...} in fabric.mod.json, *.mixins.json or pack.mcmeta must also be added to the expandProps map
# in build-logic/src/main/groovy/multiloader-common.gradle.

# Project
version=0.1.0
group=io.github.livingdeaddolls
java_version=25

# Common
minecraft_version=26.3
mod_name=Waypoints API
mod_author=Yuhrp
mod_id=waypointsapi
license=MIT
credits=
description=A client-side Fabric mod that shows places other mods find as waypoints: in one list, in the world and on map mods.
# Game versions the jar loads on (fabric.mod.json)
fabric_minecraft_dependency=~26.3
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.162.0+26.3
fabric_loader_version=0.19.5

# Dependencies
# YetAnotherConfigLib: https://modrinth.com/mod/yacl (artifact is <yacl_version>-fabric)
yacl_version=3.9.7+26.3
# Mod Menu (Fabric only, optional): https://modrinth.com/mod/modmenu
modmenu_version=21.0.0
# Seed Engine API (required, nested in the jar): the seed of the world the client is in. Built from
# Seed Engine API with ./gradlew publishToMavenLocal, read from the local Maven repository.
seedengine_version=0.1.0+26.3
# JourneyMap (optional, client): https://modrinth.com/mod/journeymap
journeymap_version=26.3-6.0.10+fabric
# Xaero's Minimap and World Map (optional, client): https://modrinth.com/mod/xaeros-minimap, https://modrinth.com/mod/xaeros-world-map
xaero_minimap_version=fabric-26.3-26.6.0
xaero_worldmap_version=fabric-26.3-1.47.0
# VoxelMap (optional, client; only waypoints added from the list): https://modrinth.com/mod/voxelmap-updated (Modrinth version id: names are shared by loaders)
voxelmap_version=u1l1hMzs

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.configuration-cache=true
